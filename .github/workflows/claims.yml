name: README claims
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # Dependency-free structural claims, so this fails in seconds rather than
  # after a Chromium install.
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert docs/TREE.md matches the tracked file set
        run: python3 bin/gen_tree.py --check

  explore-seed:
    # The test that fails when the explore layer is absent (P-8c1e). No Chromium, no model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pytest
      - run: python3 -m pytest -q checks/test_explore_text.py

  chains:
    # The operation-chain layer (docs/OPERATION-CHAINS.md): format, load, the ten verifiers (must-fire and must-hold
    # each), the HW1 fixtures and the CLI; the HW2 registration and the draft publisher's registration pinned to their fixtures, and the scorer. No Chromium, no model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pytest
      - run: python3 -m pytest -q checks/test_chain.py
      - run: python3 -m pytest -q checks/test_prediction.py
      - run: python3 -m pytest -q checks/test_draft_publish_prediction.py

  figbank:
    # the figure bank's own gates: renderer, budget/overflow/ellipsis, React host, text calibration. No browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test figbank/tests/*.test.js

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Assert README still tells the truth
        run: python3 checks/ci_claims.py
      - name: Fragment-links check must fire on the planted fixture
        run: |
          pip install --quiet pytest
          python3 -m pytest -q checks/test_fragment_links.py
      - name: sync_artifact import forms, and the limits it pins (no browser)
        run: python3 -m pytest -q checks/test_sync_artifact.py
      - name: blind_audit sees every button-like control (Chromium)
        run: python3 -m pytest -q checks/test_blind_audit_targets.py
