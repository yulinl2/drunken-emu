name: README claims
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # Dependency-free structural claims, so this fails in seconds rather than
  # after a Chromium install.
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert docs/TREE.md matches the tracked file set
        run: python3 bin/gen_tree.py --check

  explore-seed:
    # The test that fails when the explore layer is absent (P-8c1e). No Chromium, no model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pytest
      - run: python3 -m pytest -q checks/test_explore_text.py

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Assert README still tells the truth
        run: python3 checks/ci_claims.py
